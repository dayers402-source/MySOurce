<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leakz.fun - Media Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background Canvas for animated dots -->
    <canvas id="backgroundCanvas"></canvas>
    
    <!-- Cursor Dot -->
    <div id="cursor" class="cursor-dot"></div>
    
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="title">leakz.fun</h1>
            <p class="subtitle">Media Gallery & Collection</p>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- MEGA Folder 1 Section -->
        <section class="media-section" data-section-id="mega1">
            <div class="section-header">
                <h2 class="section-title">📁 MEGA Folder 1</h2>
                <p class="section-description">Content from: mega.nz/folder/qRkyjTpb</p>
                <span class="item-count">0 items</span>
            </div>
            <div class="gallery mega1-gallery"></div>
        </section>

        <!-- MEGA Folder 2 Section -->
        <section class="media-section" data-section-id="mega2">
            <div class="section-header">
                <h2 class="section-title">📁 MEGA Folder 2</h2>
                <p class="section-description">Content from: mega.nz/folder/7vonTSbK</p>
                <span class="item-count">0 items</span>
            </div>
            <div class="gallery mega2-gallery"></div>
        </section>

        <!-- leakz.fun Section -->
        <section class="media-section" data-section-id="leakz">
            <div class="section-header">
                <h2 class="section-title">🌐 leakz.fun</h2>
                <p class="section-description">Content from: leakz.fun</p>
                <span class="item-count">0 items</span>
            </div>
            <div class="gallery leakz-gallery"></div>
        </section>
    </div>

    <!-- Modal for full view -->
    <div id="modal" class="modal hidden">
        <span class="close-modal">&times;</span>
        <div class="modal-content">
            <div id="modalMedia"></div>
            <p id="modalCaption" class="modal-caption"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
